# =============================================================================
# Albion Proxy - LiteLLM Configuration
# =============================================================================
#
# HOW THIS INTEGRATES WITH server.js:
# 1. Your proxy calls LiteLLM via HTTP POST to ${LITELLM_BASE_URL}/chat/completions
# 2. LiteLLM uses this config to route 'deepseek-v4-flash' → DeepInfra
# 3. Spend is tracked per API key (master_key) for cost monitoring
# 4. Provider failures surface as HTTP 503. There is no cross-provider fallback.
#
# AUTONOMOUS BILLING SAFETY:
# DeepInfra charges the connected card automatically.
# server.js enforces pre-request cap checks BEFORE calling this proxy.
# LiteLLM tracks spend per user/session for reconciliation.
# max_budget acts as a hard ceiling safety net.
# =============================================================================

model_list:
  # PRIMARY: DeepInfra DeepSeek V4 Flash (Learner Tier / Fallback)
  - model_name: deepseek-v4-flash
    litellm_params:
      model: deepinfra/deepseek-ai/DeepSeek-V4-Flash
      api_key: os.environ/DEEPINFRA_API_KEY
      api_base: https://api.deepinfra.com/v1/openai

  # PREMIUM: DeepInfra DeepSeek V4 Pro (Starter/Pro Tiers)
  - model_name: deepseek-v4-pro
    litellm_params:
      model: deepinfra/deepseek-ai/DeepSeek-V4-Pro
      api_key: os.environ/DEEPINFRA_API_KEY
      api_base: https://api.deepinfra.com/v1/openai

  # MULTIMODAL / IMAGES: Qwen3.6-35B-A3B (Routine tasks with image context)
  - model_name: qwen3.6-35b-a3b
    litellm_params:
      model: deepinfra/Qwen/Qwen3.6-35B-A3B
      api_key: os.environ/DEEPINFRA_API_KEY
      api_base: https://api.deepinfra.com/v1/openai

  # DESIGN / UI TASKS: GLM-5.2 (UI generation, design workflows)
  - model_name: glm-5.2
    litellm_params:
      model: deepinfra/THUDM/GLM-5.2
      api_key: os.environ/DEEPINFRA_API_KEY
      api_base: https://api.deepinfra.com/v1/openai

general_settings:
  master_key: sk-albion-proxy-key-CHANGE-ME-IN-PROD
  database_url: os.environ/DATABASE_URL
  spend_tracking: true
  max_budget: 50.0  # Alpha safety cap: $50/month across all users to prevent runaway costs
  alerting: ["email"]  # Alert when 70% of max_budget is reached
